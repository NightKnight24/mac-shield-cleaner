name: Release macOS Universal

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Universal .app
        run: |
          chmod +x build.sh src/*.sh
          ./build.sh

      - name: Package .zip, .dmg and SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ZIP_NAME="Mac-Shield-and-Cleaner-${TAG}-macOS-Universal.zip"
          DMG_NAME="Mac-Shield-and-Cleaner-${TAG}-macOS-Universal.dmg"

          ditto -c -k --sequesterRsrc --keepParent \
            "build/Mac Shield & Cleaner.app" "dist/${ZIP_NAME}"

          mkdir -p dist/dmg_stage
          cp -R "build/Mac Shield & Cleaner.app" dist/dmg_stage/
          ln -s /Applications dist/dmg_stage/Applications
          hdiutil create -volname "Mac Shield & Cleaner ${TAG}" \
            -srcfolder dist/dmg_stage \
            -ov -format UDZO "dist/${DMG_NAME}"
          rm -rf dist/dmg_stage

          cd dist
          shasum -a 256 "${ZIP_NAME}" "${DMG_NAME}" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - << 'PY'
          import os, textwrap
          tag = os.environ["TAG"]
          notes = textwrap.dedent(f"""\
          ### Universal macOS Build (`arm64` Apple Silicon + `x86_64` Intel, macOS 13+)

          **Packages:**
          - **DMG Installer:** `Mac-Shield-and-Cleaner-{tag}-macOS-Universal.dmg` (open and drag to Applications)
          - **ZIP Archive:** `Mac-Shield-and-Cleaner-{tag}-macOS-Universal.zip`

          > **Note on Gatekeeper (Ad-Hoc Signed):** Because this open-source build is ad-hoc signed rather than notarized with a paid Apple Developer ID, macOS may warn on first launch. Right-click **Mac Shield & Cleaner.app → Open**, or run:
          > ```bash
          > xattr -cr "/Applications/Mac Shield & Cleaner.app"
          > ```
          """)
          open("dist/RELEASE_NOTES.md", "w").write(notes)
          PY

          gh release create "${TAG}" \
            "dist/Mac-Shield-and-Cleaner-${TAG}-macOS-Universal.zip" \
            "dist/Mac-Shield-and-Cleaner-${TAG}-macOS-Universal.dmg" \
            "dist/SHA256SUMS.txt" \
            --title "Mac Shield & Cleaner ${TAG}" \
            --notes-file dist/RELEASE_NOTES.md
